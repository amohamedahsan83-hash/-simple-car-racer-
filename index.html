<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Car Racer</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d130e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 90vh;
      max-height: 750px;
      background: #1b5e20;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      border-radius: 16px;
    }
    canvas {
      width: 100%;

    .overlay p {

      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="score">SCORE: <span id="score-text">0</span></div>
      <div class="best">BEST: <span id="best-text">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-hints">
      <span>◀ TAP / HOLD LEFT</span>
      <span>TAP / HOLD RIGHT ▶</span>
    </div>

    <div id="overlay" class="overlay">
      <h1 id="overlay-title">RETRO RACER</h1>
      <p id="overlay-desc">Use Left / Right arrow keys or tap each side of the screen to dodge traffic.</p>
      <button id="start-btn" class="btn">START RACE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayDesc = document.getElementById("overlay-desc");
    const startBtn = document.getElementById("start-btn");
    const scoreText = document.getElementById("score-text");
    const bestText = document.getElementById("best-text");

    let width, height;
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Audio synthesizer using Web Audio API
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playBeep(freq, type, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // High Score persistence
    let highScore = localStorage.getItem("retro_racer_high") || 0;
    bestText.innerText = highScore;

    // Game Variables
    let isPlaying = false;
    let score = 0;
    let playerX = 0; // -1 to +1
    let roadStripeOffset = 0;
    let baseSpeed = 0.015;
    let gameSpeed = baseSpeed;
    let obstacles = [];
    let particles = [];
    const colors = ["#e91e63", "#9c27b0", "#3f51b5", "#00bcd4", "#ff9800", "#4caf50"];

    // Keyboard controls
    const keys = { left: false, right: false };

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    // Touch & Mouse steering
    let isHoldingPointer = false;
    let pointerSide = 0;

    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const x = clientX - rect.left;
      pointerSide = x < rect.width / 2 ? -1 : 1;
    }

    canvas.addEventListener("touchstart", (e) => {
      isHoldingPointer = true;
      handlePointer(e);
    }, { passive: true });

    canvas.addEventListener("touchmove", handlePointer, { passive: true });
    window.addEventListener("touchend", () => { isHoldingPointer = false; });

    canvas.addEventListener("mousedown", (e) => {
      isHoldingPointer = true;
      handlePointer(e);
    });
    window.addEventListener("mouseup", () => { isHoldingPointer = false; });

    function spawnObstacle() {
      const lanes = [-0.55, 0, 0.55];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      obstacles.push({ x: lane, y: -0.3, color: color });
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          alpha: 1.0,
          color: ["#ff5252", "#ffb142", "#ffffff"][Math.floor(Math.random() * 3)]
        });
      }
    }

    function startGame() {
      initAudio();
      isPlaying = true;
      score = 0;
      gameSpeed = baseSpeed;
      playerX = 0;
      obstacles = [];
      particles = [];
      spawnObstacle();
      scoreText.innerText = "0";
      overlay.style.display = "none";
      overlay.classList.remove("game-over");
    }

    function gameOver() {
      isPlaying = false;
      playBeep(120, "sawtooth", 0.5);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("retro_racer_high", highScore);
        bestText.innerText = highScore;
      }

      overlay.classList.add("game-over");
      overlayTitle.innerText = "GAME OVER";
      overlayDesc.innerText = `You scored ${score} points!`;
      startBtn.innerText = "PLAY AGAIN";
      overlay.style.display = "flex";
    }

    startBtn.addEventListener("click", startGame);

    // Procedural Car Sprite Drawing
    function drawCar(x, y, w, h, color, isPlayer) {
      ctx.save();
      ctx.translate(x, y);

      // Wheels
      ctx.fillStyle = "#111";
      ctx.fillRect(-w * 0.48, -h * 0.35, w * 0.12, h * 0.25);
      ctx.fillRect(w * 0.36, -h * 0.35, w * 0.12, h * 0.25);
      ctx.fillRect(-w * 0.48, h * 0.1, w * 0.12, h * 0.25);
      ctx.fillRect(w * 0.36, h * 0.1, w * 0.12, h * 0.25);

      // Car Body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w * 0.38, -h * 0.45, w * 0.76, h * 0.9, 8);
      ctx.fill();

      // Windshield & Roof
      ctx.fillStyle = isPlayer ? "#00e5ff" : "#1a1a1a";
      ctx.beginPath();
      ctx.roundRect(-w * 0.26, -h * 0.15, w * 0.52, h * 0.35, 4);
      ctx.fill();

      // Lights
      ctx.fillStyle = isPlayer ? "#ffffff" : "#ff3d00";
      ctx.fillRect(-w * 0.3, -h * 0.43, w * 0.14, h * 0.05);
      ctx.fillRect(w * 0.16, -h * 0.43, w * 0.14, h * 0.05);

      ctx.restore();
    }

    // Main Engine Loop
    function update() {
      // Draw background grass
      ctx.fillStyle = "#1b5e20";
      ctx.fillRect(0, 0, width, height);

      // Draw asphalt road
      const roadWidth = width * 0.85;
      const roadLeft = (width - roadWidth) / 2;
      ctx.fillStyle = "#2b2b2b";
      ctx.fillRect(roadLeft, 0, roadWidth, height);

      // Road lane stripes
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.setLineDash([30, 25]);
      ctx.lineDashOffset = -roadStripeOffset;

      const lane1X = roadLeft + roadWidth * 0.33;
      const lane2X = roadLeft + roadWidth * 0.66;

      ctx.beginPath();
      ctx.moveTo(lane1X, 0); ctx.lineTo(lane1X, height);
      ctx.moveTo(lane2X, 0); ctx.lineTo(lane2X, height);
      ctx.stroke();
      ctx.setLineDash([]);

      const carW = width * 0.16;
      const carH = height * 0.12;
      const playerPixelY = height * 0.75;
      const playerPixelX = width / 2 + playerX * (roadWidth / 2 - carW * 0.7);

      if (isPlaying) {
        roadStripeOffset += gameSpeed * height * 1.5;

        // Steering logic
        const steerSpeed = 0.035;
        if (keys.left) playerX -= steerSpeed;
        if (keys.right) playerX += steerSpeed;
        if (isHoldingPointer) playerX += pointerSide * steerSpeed;

        playerX = Math.max(-0.8, Math.min(0.8, playerX));

        // Spawn obstacles
        if (obstacles.length === 0 || (obstacles[obstacles.length - 1].y > -0.05 && Math.random() < 0.035)) {
          spawnObstacle();
        }

        // Move and evaluate obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += gameSpeed;

          const obsPixelX = width / 2 + obs.x * (roadWidth / 2 - carW * 0.7);
          const obsPixelY = obs.y * height;

          drawCar(obsPixelX, obsPixelY, carW, carH, obs.color, false);

          // Bounding box collision detection
          if (
            Math.abs(playerPixelX - obsPixelX) < carW * 0.8 &&
            Math.abs(playerPixelY - obsPixelY) < carH * 0.8
          ) {
            createExplosion(playerPixelX, playerPixelY);
            gameOver();
            break;
          }

          // Off-screen scoring
          if (obs.y > 1.2) {
            obstacles.splice(i, 1);
            score += 10;
            scoreText.innerText = score;
            playBeep(440, "sine", 0.05);
            gameSpeed = baseSpeed + (score / 1200) * 0.015;
          }
        }
      }

      // Draw Player Car
      drawCar(playerPixelX, playerPixelY, carW, carH, "#ff1744", true);

      // Render explosion particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
